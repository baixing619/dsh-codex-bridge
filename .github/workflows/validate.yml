name: Validate and package
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: Publish the package version after all checks pass
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm test
      - if: runner.os == 'Windows'
        shell: powershell
        run: ./tests/installer.test.ps1
  package:
    needs: test
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - id: package
        shell: pwsh
        run: |
          npm run package
          if ($LASTEXITCODE -ne 0) { throw 'Packaging failed' }
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          "version=$version" >> $env:GITHUB_OUTPUT
      - shell: powershell
        run: ./tests/package.test.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: dsh-codex-bridge-v${{ steps.package.outputs.version }}
          path: |
            dist/*.zip
            dist/SHA256SUMS.txt
      - if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.release))
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PACKAGE_VERSION: ${{ steps.package.outputs.version }}
        run: |
          $tag = 'v' + $env:PACKAGE_VERSION
          gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) { Write-Output 'Release exists; preserving its original assets.'; exit 0 }
          gh release create $tag dist/*.zip dist/SHA256SUMS.txt --target "${{ github.sha }}" --title "$tag — Skill and DSH plugin service" --notes "Runtime package containing the Codex skill, CLI, DSH plugin service, Windows installer, README and MIT license. Tests and build tools remain in the repository. Built, tested and checked on GitHub-hosted runners with synthetic DSH fixtures."
          if ($LASTEXITCODE -ne 0) { throw 'Release upload failed' }
