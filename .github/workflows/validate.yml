name: Validate and package
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: Publish v0.1.0 after all checks pass
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm test
      - if: runner.os == 'Windows'
        shell: powershell
        run: ./tests/installer.test.ps1
  package:
    needs: test
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: dsh-codex-bridge-v0.1.0
          path: |
            dist/*.zip
            dist/SHA256SUMS.txt
      - if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view v0.1.0 2>$null
          if ($LASTEXITCODE -eq 0) { Write-Output 'Release exists; preserving its original assets.'; exit 0 }
          gh release create v0.1.0 dist/*.zip dist/SHA256SUMS.txt --target "${{ github.sha }}" --title "v0.1.0 — Skill and DSH plugin service" --notes "Contains the Codex skill, CLI, DSH plugin service, installer and source tests. Built and tested on GitHub-hosted runners; no personal DSH data is included."
          if ($LASTEXITCODE -ne 0) { throw 'Release upload failed' }
